<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="50%" stop-color="#101f42" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>

    <!-- Vibrant Dynamic Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f192e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Dynamic Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated/Dynamic Background Elements (Flow waves & Node Network) -->
  <g opacity="0.25">
    <!-- Grid pattern -->
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#00f2fe" stroke-width="0.5" stroke-dasharray="4 8" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#00f2fe" stroke-width="0.5" stroke-dasharray="4 8" />

    <!-- Dynamic Curved Sine Waves -->
    <path d="M-50 320 Q 300 150, 600 300 T 1250 200" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M-50 320 Q 300 150, 600 300 T 1250 200; M-50 250 Q 300 350, 600 200 T 1250 320; M-50 320 Q 300 150, 600 300 T 1250 200" />
    </path>
    <path d="M-50 180 Q 300 320, 700 150 T 1250 280" fill="none" stroke="url(#purpleGrad)" stroke-width="3" opacity="0.7">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M-50 180 Q 300 320, 700 150 T 1250 280; M-50 280 Q 300 120, 700 300 T 1250 180; M-50 180 Q 300 320, 700 150 T 1250 280" />
    </path>
  </g>

  <!-- Decorative Glowing Orbs -->
  <circle cx="150" cy="80" r="120" fill="#00f2fe" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="320" r="140" fill="#7f00ff" opacity="0.15" filter="url(#glow)" />

  <!-- Background Interactive/Tech Accent Cards in background -->
  <g opacity="0.4" transform="translate(850, 40)">
    <rect width="280" height="140" rx="12" fill="url(#cardGrad)" stroke="#4facfe" stroke-width="1.5" />
    <text x="20" y="35" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">📊 Site Operations Metrics</text>
    <rect x="20" y="55" width="200" height="8" rx="4" fill="#102542" />
    <rect x="20" y="55" width="150" height="8" rx="4" fill="url(#accentGrad)" />
    <rect x="20" y="80" width="200" height="8" rx="4" fill="#102542" />
    <rect x="20" y="80" width="180" height="8" rx="4" fill="url(#purpleGrad)" />
    <circle cx="240" cy="105" r="16" fill="url(#accentGrad)" opacity="0.8" />
  </g>

  <!-- FOREGROUND CONTENT: Header & Subtitle (High contrast, clearly visible) -->
  <g filter="url(#textShadow)">
    <!-- Badge Top Pill -->
    <g transform="translate(80, 55)">
      <rect width="270" height="34" rx="17" fill="#10254a" stroke="url(#accentGrad)" stroke-width="1.5" />
      <text x="20" y="22" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
        🏥 CLINICAL RESEARCH ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="80" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Clinical Research
    </text>
    <text x="80" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Site Management
    </text>

    <!-- Subtitle -->
    <text x="80" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">
      Curated directory of CTMS, eRegulatory Binders, EDC, eConsent &amp; Site Operations Platforms
    </text>

    <!-- Key Tech Feature Pills -->
    <g transform="translate(80, 285)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="8" fill="#162c54" stroke="#254a85" stroke-width="1" />
        <text x="14" y="21" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">⚡ SaaS &amp; Cloud</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="155" height="32" rx="8" fill="#162c54" stroke="#254a85" stroke-width="1" />
        <text x="14" y="21" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="600">💻 Open-Source EDC</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(309, 0)">
        <rect width="150" height="32" rx="8" fill="#162c54" stroke="#254a85" stroke-width="1" />
        <text x="14" y="21" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">🛡️ 21 CFR Part 11</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(471, 0)">
        <rect width="140" height="32" rx="8" fill="#162c54" stroke="#254a85" stroke-width="1" />
        <text x="14" y="21" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="600">📊 CTMS Metrics</text>
      </g>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accentGrad)" rx="3" />
</svg>
